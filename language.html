<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Indic Letters - Learn Indian Scripts</title>
    <meta
      name="description"
      content="Start learning Indian alphabets online. Use this page as a handy reference to see and practice writing all the letters and their combinations."

    <meta
      name="keywords"
      content="India, language, Indian languages, Indian alphabets, Indian letters, Indian scripts, learn Kannada, Kannada script, Kannada letters, Kannada varnamala, learn Tamil, Tamil script, Tamil letters, Tamil varnamala, learn Malayalam, Malayalam script, Malayalam letters, Malayalam varnamala, learn Telugu, Telugu script, Telugu letters, Telugu varnamala, learn Marathi, Marathi script, Marathi letters, Marathi varnamala, learn Odia, Odia script, Odia letters, Odia varnamala"
    />
    <meta name="author" content="Chandu JR" />
    <meta name="theme-color" content="#6366f1" />

    <meta property="og:title" content="Learn Indian Scripts" />
    <meta
      property="og:description"
      content="Start learning Indian alphabets online. Use this page as a handy reference to see and practice writing all the letters and their combinations."
    />

    <meta property="og:url" content="https://indicletters.com/" />
    <meta property="og:image" content="https://indicletters.com/assets/preview.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Learn Indian Scripts" />
    <meta
      name="twitter:description"
      content="Start learning Indian alphabets online. Use this page as a handy reference to see and practice writing all the letters and their combinations."
    />

    <script>
      (function () {
        // Inline script to apply theme immediately
        const savedTheme = localStorage.theme || "light";
        document.documentElement.classList.toggle("dark", savedTheme === "dark");
      })();
    </script>

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/modern-normalize.min.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/writing-pad.css" />
    <link rel="icon" href="assets/favicon.png" />

    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1292852975196451"
      crossorigin="anonymous"
    ></script>
  </head>
  <body tabindex="-1">
    <div id="warning-block" class="warning-block">⚠️ Please enable JavaScript to view this page properly</div>
    <script>
      (function () {
        document.getElementById("warning-block").style.display = "none";
      })();
    </script>

    <header class="site-header">
      <div class="site-brand" id="home-nav">
        <img src="assets/icon-192.png" alt="Indic Letters Logo" class="brand-logo" />
        <span>Indic Letters</span>
      </div>
      <div class="right-actions">
        <button id="home-button" class="nav-btn">🏠</button>
        <button id="blank-board-button" class="nav-btn">📝</button>
        <button id="github-button" class="nav-btn">ℹ️</button>
        <button id="theme-toggle" class="nav-btn">🌙</button>
      </div>
    </header>

    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
    </div>

    <div id="toast" class="toast hidden">
      <div class="toast-content">
        <div id="toast-icon" class="toast-icon"></div>
        <div id="toast-message" class="toast-message"></div>
      </div>
    </div>
    <div class="container">
      <header>
        <h1 id="lang-name"></h1>
      </header>

      <div class="writing-bg" id="writing-bg"></div>
      <div class="writing-pad" id="writing-pad">
        <div class="writing-pad-header" id="writing-pad-header">PRACTICE</div>
        <button class="close-button">×</button>
        <canvas id="glyph-canvas"></canvas>
        <div class="writing-translit latin-sub" id="writing-translit"></div>
        <canvas id="writing-canvas"></canvas>
        <button class="eraser-button">🧼</button>
        <button class="clear-button">🗑️</button>
      </div>

      <main>
        <div class="tab-navigation">
          <button class="tab-btn active" data-tab="vowels-basic">Vowels</button>
          <button class="tab-btn" data-tab="vowels">Consonant + Vowel</button>
          <button class="tab-btn" data-tab="conjuncts">Consonant + Consonant</button>
        </div>

        <div class="tab-content">
          <section id="vowels-basic-tab" class="tab-pane active">
            <div class="table-wrapper">
              <table class="vowels-table">
                <thead>
                  <tr>
                    <th>Symbol</th>
                    <th>Romanization</th>
                  </tr>
                </thead>
                <tbody id="vowels-basic-body"></tbody>
              </table>
            </div>
          </section>

          <section id="vowels-tab" class="tab-pane">
            <div class="table-wrapper">
              <table class="letters-table">
                <thead id="alphabet-header"></thead>
                <tbody id="alphabet-body"></tbody>
              </table>
            </div>
          </section>

          <!-- Common consonant combos -->
          <section id="conjuncts-tab" class="tab-pane">
            <div class="table-wrapper">
              <table class="conjuncts-table">
                <thead>
                  <tr>
                    <th>Conjunct</th>
                    <th>Form</th>
                    <th>Romanization</th>
                  </tr>
                </thead>
                <tbody id="conjunct-body"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>

      <footer>
        <p>© 2025 Indic Letters</p>
      </footer>
    </div>

    <script type="module">
      import { getStroke } from "https://cdn.skypack.dev/perfect-freehand";
      window.PerfectFreehand = { getStroke };
    </script>
    <script src="js/main.js"></script>
    <script src="js/language-loader.js"></script>
    <script src="js/writing-pad.js"></script>
  </body>
</html>
